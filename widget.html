<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:700 20px system-ui;overflow:hidden}.alert{margin:24px;padding:22px;border:2px solid #22f0ff;border-radius:18px;background:#0b0615ee;box-shadow:0 0 34px #22f0ff88;transform:translateY(-150%);opacity:0;transition:.45s cubic-bezier(.2,1.1,.3,1.2)}.alert.on{transform:none;opacity:1}.kind{font-size:14px;color:#22f0ff}.sum{font-size:38px;color:#b6ff3b;margin:4px 0}.msg{font-weight:500;color:#e9dcff}.donor{color:#ff2bd6}
</style></head><body><div class="alert" id="a"><div class="kind" id="k">ДОНАТ</div><div class="sum" id="s"></div><div class="msg"><span class="donor" id="d"></span> <span id="m"></span></div></div><script>
const token='__TOKEN__', wanted='__KIND__';let last=0,busy=false;const fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₸';
async function poll(){try{const r=await fetch(`/api/widget/${token}/latest?after=${last}`),j=await r.json(),x=j.donation;if(!x||busy)return;if(wanted!=='alerts'&&wanted!==x.kind)return;last=x.id;busy=true;k.textContent=x.kind.toUpperCase();s.textContent=fmt(x.amount);d.textContent=x.donor+':';m.textContent=x.message||'Спасибо за поддержку!';a.classList.add('on');setTimeout(()=>a.classList.remove('on'),6500);setTimeout(()=>busy=false,7200)}catch(e){}}setInterval(poll,1000);poll();
</script></body></html>
